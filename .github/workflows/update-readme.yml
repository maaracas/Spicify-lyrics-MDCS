name: Update README with Spotify Info

on:
  workflow_dispatch:
  push:
    paths:
      - '*.ttml'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Song Metadata & Update README
        env:
          CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          python - << 'EOF'
          import os, glob, requests

          client_id = os.environ.get('CLIENT_ID', '').strip()
          client_secret = os.environ.get('CLIENT_SECRET', '').strip()

          if not client_id or not client_secret:
              print("❌ ERROR: No se encontraron los secretos CLIENT_ID o CLIENT_SECRET.")
              exit(1)

          # Petición de token directa a Spotify
          auth_data = {
              "grant_type": "client_credentials",
              "client_id": client_id,
              "client_secret": client_secret
          }
          
          res = requests.post("https://accounts.spotify.com/api/token", data=auth_data)
          res_json = res.json()
          token = res_json.get("access_token")

          if not token:
              print(f"❌ ERROR AUTENTICACIÓN SPOTIFY ({res.status_code}): {res_json}")
              exit(1)

          print("✅ Autenticación con Spotify exitosa.")

          spotify_headers = {"Authorization": f"Bearer {token}"}
          ttml_files = sorted(glob.glob("*.ttml"))

          readme_content = "# 🎵 Mis Letras Sincronizadas\n\n"
          readme_content += "Lista e índice de las letras sincronizadas actualizadas automáticamente.\n\n"
          readme_content += "| Canción | Artista | Enlace al Archivo (.ttml) | ID de Spotify |\n"
          readme_content += "| :--- | :--- | :--- | :--- |\n"

          for file in ttml_files:
              track_id = file.replace(".ttml", "").strip()
              response = requests.get(f"https://api.spotify.com/v1/tracks/{track_id}", headers=spotify_headers)
              
              if response.status_code == 200:
                  track_data = response.json()
                  title = track_data.get("name", "Desconocido")
                  artist = ", ".join([a["name"] for a in track_data.get("artists", [])])
                  print(f"🎵 Encontrada: {title} - {artist}")
              else:
                  print(f"⚠️ Error al obtener track {track_id} ({response.status_code}): {response.text}")
                  title = "Desconocido"
                  artist = "Desconocido"

              readme_content += f"| **{title}** | {artist} | [`{file}`](./{file}) | `{track_id}` |\n"

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme_content)
          EOF

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update README with track info" && git push)
