name: Update README with Track Info

on:
  workflow_dispatch:
  push:
    paths:
      - '*.ttml'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch Song Metadata & Update README
        run: |
          python - << 'EOF'
          import glob, re, os, requests
          from bs4 import BeautifulSoup

          ttml_files = sorted(glob.glob("*.ttml"))

          readme_content = "# 🎵 Mis Letras Sincronizadas\n\n"
          readme_content += "Lista e índice de las letras sincronizadas actualizadas automáticamente.\n\n"
          readme_content += "| Canción | Artista | Enlace al Archivo (.ttml) | ID de Spotify |\n"
          readme_content += "| :--- | :--- | :--- | :--- |\n"

          for file in ttml_files:
              track_id = file.replace(".ttml", "").strip()
              title = ""
              artist = ""
              
              # 1. Intentar leer dentro del propio archivo TTML
              try:
                  with open(file, 'r', encoding='utf-8') as f:
                      content = f.read()
                      
                      # Buscar metadatos en etiquetas ttm:title o ttm:agent/metadata
                      t_match = re.search(r'<ttm:title>(.*?)</ttm:title>', content, re.IGNORECASE)
                      if t_match:
                          title = t_match.group(1).strip()
                          
                      a_match = re.search(r'<ttm:artist>(.*?)</ttm:artist>', content, re.IGNORECASE)
                      if a_match:
                          artist = a_match.group(1).strip()
              except Exception as e:
                  print(f"Error leyendo archivo {file}: {e}")

              # 2. Si no los encuentra dentro del TTML, consultar el oEmbed público de Spotify en JSON
              if not title or not artist:
                  try:
                      oembed_url = f"https://open.spotify.com/oembed?url=https://open.spotify.com/track/{track_id}"
                      res = requests.get(oembed_url, timeout=5)
                      if res.status_code == 200:
                          data = res.json()
                          title = data.get("title", title)
                          # El title en oEmbed suele venir como "Nombre Canción" y el autor en "author_name"
                          artist = data.get("author_name", artist)
                  except Exception as e:
                      print(f"Error oEmbed para {track_id}: {e}")

              # Valores por defecto si nada responde
              if not title: title = "Desconocido"
              if not artist: artist = "Desconocido"

              readme_content += f"| **{title}** | {artist} | [`{file}`](./{file}) | `{track_id}` |\n"

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme_content)
          EOF

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update README with track info" && git push)
