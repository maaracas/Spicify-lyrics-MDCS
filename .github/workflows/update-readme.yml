name: Update README with Track Info

on:
  workflow_dispatch:
  push:
    paths:
      - '*.ttml'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch Song Metadata & Update README
        run: |
          python - << 'EOF'
          import glob, re, requests
          from bs4 import BeautifulSoup

          ttml_files = sorted(glob.glob("*.ttml"))

          readme_content = "# 🎵 Mis Letras Sincronizadas\n\n"
          readme_content += "Lista e índice de las letras sincronizadas actualizadas automáticamente.\n\n"
          readme_content += "| Canción | Artista | Enlace al Archivo (.ttml) | ID de Spotify |\n"
          readme_content += "| :--- | :--- | :--- | :--- |\n"

          # User Agent de Bot de Redes Sociales (fuerza a Spotify a entregar metadatos Open Graph limpios)
          bot_headers = {
              "User-Agent": "Twitterbot/1.0",
              "Accept-Language": "en-US,en;q=0.9"
          }

          for file in ttml_files:
              track_id = file.replace(".ttml", "").strip()
              title = "Desconocido"
              artist = "Desconocido"

              # --- NIVEL 1: Meta-tags directas simulando vista previa de Twitter/WhatsApp ---
              try:
                  track_url = f"https://open.spotify.com/track/{track_id}"
                  res = requests.get(track_url, headers=bot_headers, timeout=8)
                  if res.status_code == 200:
                      soup = BeautifulSoup(res.text, 'html.parser')
                      
                      # Extraer Título
                      og_title = soup.find("meta", property="og:title")
                      if og_title and og_title.get("content"):
                          title = og_title["content"].strip()

                      # Extraer Artista
                      meta_artist = soup.find("meta", name="twitter:audio:artist_name") or soup.find("meta", property="music:musician")
                      if meta_artist and meta_artist.get("content"):
                          artist = meta_artist["content"].strip()
                      else:
                          # Parsear og:description (ej: "Listen to Swear On My Sex Life on Spotify. McKayla Twiggs · Song · 2024")
                          og_desc = soup.find("meta", property="og:description")
                          if og_desc and og_desc.get("content"):
                              desc = og_desc["content"]
                              if "·" in desc:
                                  parts = [p.strip() for p in desc.split("·")]
                                  # Si el formato es "Artista · Song · Año"
                                  if len(parts) >= 2:
                                      artist = parts[0]
                              elif "by" in desc.lower():
                                  m = re.search(r'by\s+(.*?)\s+on\s+Spotify', desc, re.IGNORECASE)
                                  if m:
                                      artist = m.group(1).strip()
              except Exception as e:
                  print(f"Error Nivel 1 para {track_id}: {e}")

              # --- NIVEL 2: Rescate vía oEmbed oficial de Spotify ---
              if title == "Desconocido" or artist == "Desconocido":
                  try:
                      oembed_url = f"https://open.spotify.com/oembed?url=https://open.spotify.com/track/{track_id}"
                      res_oe = requests.get(oembed_url, timeout=5)
                      if res_oe.status_code == 200:
                          data = res_oe.json()
                          if title == "Desconocido":
                              title = data.get("title", title)
                          
                          # Si no tenemos artista, buscar enlaces de artista dentro del HTML devuelto en oEmbed
                          if artist == "Desconocido" and "html" in data:
                              html_content = data["html"]
                              soup_oe = BeautifulSoup(html_content, 'html.parser')
                              # Buscar etiquetas de artista o enlaces /artist/
                              artist_links = soup_oe.find_all("a", href=re.compile(r'/artist/'))
                              if artist_links:
                                  artists_list = [a.get_text().strip() for a in artist_links if a.get_text().strip()]
                                  if artists_list:
                                      artist = ", ".join(artists_list)
                  except Exception as e:
                      print(f"Error Nivel 2 para {track_id}: {e}")

              print(f"✅ Resultado para {track_id}: [{title}] de [{artist}]")
              readme_content += f"| **{title}** | {artist} | [`{file}`](./{file}) | `{track_id}` |\n"

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme_content)
          EOF

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update README with track info" && git push)
