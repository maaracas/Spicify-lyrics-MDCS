name: Update README with Track Info

on:
  workflow_dispatch:
  push:
    paths:
      - '*.ttml'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch Song Metadata & Update README
        run: |
          python - << 'EOF'
          import glob, requests, re
          from bs4 import BeautifulSoup

          ttml_files = sorted(glob.glob("*.ttml"))

          readme_content = "# 🎵 Mis Letras Sincronizadas\n\n"
          readme_content += "Lista e índice de las letras sincronizadas actualizadas automáticamente.\n\n"
          readme_content += "| Canción | Artista | Enlace al Archivo (.ttml) | ID de Spotify |\n"
          readme_content += "| :--- | :--- | :--- | :--- |\n"

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          for file in ttml_files:
              track_id = file.replace(".ttml", "").strip()
              title = "Desconocido"
              artist = "Desconocido"
              
              # Búsqueda pública en la vista embed de Spotify
              url = f"https://open.spotify.com/embed/track/{track_id}"
              try:
                  res = requests.get(url, headers=headers, timeout=10)
                  if res.status_code == 200:
                      soup = BeautifulSoup(res.text, 'html.parser')
                      # Extraer título de las meta tags abiertas
                      og_title = soup.find("meta", property="og:title")
                      og_description = soup.find("meta", property="og:description")
                      
                      if og_title and og_title.get("content"):
                          title = og_title["content"]
                      
                      if og_description and og_description.get("content"):
                          # La descripción suele ser "Song · Artista · Year" o "Artista · Song"
                          desc = og_description["content"]
                          parts = [p.strip() for p in desc.split("·")]
                          if len(parts) >= 2:
                              artist = parts[1] if parts[0].lower() in ["song", "canción"] else parts[0]
                          else:
                              artist = desc

                      print(f"🎵 Encontrada en Spotify Web: {title} - {artist}")
                  else:
                      print(f"⚠️ Error al acceder al embed de Spotify para {track_id}: {res.status_code}")
              except Exception as e:
                  print(f"❌ Error consultando web para {track_id}: {e}")

              readme_content += f"| **{title}** | {artist} | [`{file}`](./{file}) | `{track_id}` |\n"

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme_content)
          EOF

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update README with track info" && git push)
