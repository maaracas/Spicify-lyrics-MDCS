name: Update README with Track Info

on:
  workflow_dispatch:
  push:
    paths:
      - '*.ttml'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Song Metadata & Update README
        run: |
          python - << 'EOF'
          import glob, requests

          ttml_files = sorted(glob.glob("*.ttml"))

          readme_content = "# 🎵 Mis Letras Sincronizadas\n\n"
          readme_content += "Lista e índice de las letras sincronizadas actualizadas automáticamente.\n\n"
          readme_content += "| Canción | Artista | Enlace en Spotify | Archivo (.ttml) | ID de Spotify |\n"
          readme_content += "| :--- | :--- | :--- | :--- | :--- |\n"

          for file in ttml_files:
              track_id = file.replace(".ttml", "").strip()
              spotify_url = f"https://open.spotify.com/track/{track_id}"
              title = "Desconocido"
              artist = "Desconocido"

              # Petición limpia a oEmbed de Spotify
              try:
                  oembed_url = f"https://open.spotify.com/oembed?url={spotify_url}"
                  res = requests.get(oembed_url, timeout=10)
                  if res.status_code == 200:
                      data = res.json()
                      title = data.get("title", title)
                      artist = data.get("author_name", artist)
                      print(f"✅ ID: {track_id} -> Título: {title} | Artista: {artist}")
                  else:
                      print(f"⚠️ oEmbed respondió status {res.status_code} para ID: {track_id}")
              except Exception as e:
                  print(f"❌ Error al consultar oEmbed para ID {track_id}: {e}")

              readme_content += f"| **{title}** | {artist} | [Spotify link]({spotify_url}) | [`{file}`](./{file}) | `{track_id}` |\n"

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme_content)
          EOF

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update README with track info" && git push)
