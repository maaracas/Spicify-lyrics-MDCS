name: Update README with Track Info

on:
  workflow_dispatch:
  push:
    paths:
      - '*.ttml'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Song Metadata & Update README
        run: |
          python - << 'EOF'
          import glob, requests

          ttml_files = sorted(glob.glob("*.ttml"))

          readme_content = "# 🎵 Mis Letras Sincronizadas\n\n"
          readme_content += "Lista e índice de las letras sincronizadas actualizadas automáticamente.\n\n"
          readme_content += "| Canción | Artista | Enlace al Archivo (.ttml) | ID de Spotify |\n"
          readme_content += "| :--- | :--- | :--- | :--- |\n"

          for file in ttml_files:
              track_id = file.replace(".ttml", "").strip()
              title = "Desconocido"
              artist = "Desconocido"
              
              # Intento de consulta en LRCLIB / API Abierta
              try:
                  res = requests.get(f"https://lrclib.net/api/get-by-spotify-id/{track_id}", timeout=5)
                  if res.status_code == 200:
                      data = res.json()
                      title = data.get("trackName", "Desconocido")
                      artist = data.get("artistName", "Desconocido")
                      print(f"🎵 Encontrada en LRCLIB: {title} - {artist}")
                  else:
                      print(f"⚠️ No encontrada en API abierta para track {track_id} (Status {res.status_code})")
              except Exception as e:
                  print(f"❌ Error al consultar: {e}")

              readme_content += f"| **{title}** | {artist} | [`{file}`](./{file}) | `{track_id}` |\n"

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme_content)
          EOF

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update README with track info" && git push)
