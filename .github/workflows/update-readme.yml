name: Update README with Track Info

on:
  workflow_dispatch:
  push:
    paths:
      - '*.ttml'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch Song Metadata & Update README
        run: |
          python - << 'EOF'
          import glob, re, requests
          from bs4 import BeautifulSoup

          ttml_files = sorted(glob.glob("*.ttml"))

          readme_content = "# 🎵 Mis Letras Sincronizadas\n\n"
          readme_content += "Lista e índice de las letras sincronizadas actualizadas automáticamente.\n\n"
          readme_content += "| Canción | Artista | Enlace al Archivo (.ttml) | ID de Spotify |\n"
          readme_content += "| :--- | :--- | :--- | :--- |\n"

          for file in ttml_files:
              track_id = file.replace(".ttml", "").strip()
              title = "Desconocido"
              artist = "Desconocido"

              # 1. Probar vía oEmbed oficial de Spotify
              try:
                  oembed_url = f"https://open.spotify.com/oembed?url=https://open.spotify.com/track/{track_id}"
                  res = requests.get(oembed_url, timeout=5)
                  if res.status_code == 200:
                      data = res.json()
                      title = data.get("title", "Desconocido")
                      
                      # Intentar extraer artista del título si viene como "Song by Artist"
                      if "by" in title:
                          parts = title.split("by")
                          title = parts[0].strip()
                          artist = parts[1].strip()
                      elif "author_name" in data and data["author_name"]:
                          artist = data["author_name"]
                      
                      # Si hay HTML embed, extraer iframe title que suele tener "Song by Artist"
                      if artist == "Desconocido" and "html" in data:
                          soup = BeautifulSoup(data["html"], 'html.parser')
                          iframe = soup.find('iframe')
                          if iframe and iframe.get('title'):
                              iframe_title = iframe['title']
                              if "by" in iframe_title:
                                  parts = iframe_title.split("by")
                                  title = parts[0].replace("Spotify Embed:", "").strip()
                                  artist = parts[1].strip()
              except Exception as e:
                  print(f"Error oEmbed para {track_id}: {e}")

              # 2. Si sigue desconocido, consultar el Widget Embed directamente
              if title == "Desconocido" or artist == "Desconocido":
                  try:
                      embed_url = f"https://open.spotify.com/embed/track/{track_id}"
                      headers = {"User-Agent": "Mozilla/5.0"}
                      res = requests.get(embed_url, headers=headers, timeout=5)
                      if res.status_code == 200:
                          soup = BeautifulSoup(res.text, 'html.parser')
                          script_tag = soup.find('script', id='initial-state') or soup.find('script', id='session')
                          if script_tag:
                              text = script_tag.string or ""
                              # Buscar patrones de nombre y artista en el estado JS
                              name_match = re.search(r'"name":"([^"]+)"', text)
                              if name_match and title == "Desconocido":
                                  title = name_match.group(1)
                  except Exception as e:
                      print(f"Error Embed Script para {track_id}: {e}")

              print(f"Procesado: {track_id} -> {title} - {artist}")
              readme_content += f"| **{title}** | {artist} | [`{file}`](./{file}) | `{track_id}` |\n"

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme_content)
          EOF

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update README with track info" && git push)
