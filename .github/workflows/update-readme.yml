name: Update README with Track Info

on:
  workflow_dispatch:
  push:
    paths:
      - '*.ttml'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch Song Metadata & Update README
        run: |
          python - << 'EOF'
          import glob, re, requests
          from bs4 import BeautifulSoup

          ttml_files = sorted(glob.glob("*.ttml"))

          readme_content = "# TTML Songs IDs\n\n"
          readme_content += "Índice de IDs TTML y letras sincronizadas.\n\n"
          readme_content += "| Canción | Artista | Enlace en Spotify | Archivo (.ttml) | ID de Spotify |\n"
          readme_content += "| :--- | :--- | :--- | :--- | :--- |\n"

          headers = {
              "User-Agent": "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)",
              "Accept-Language": "es-ES,es;q=0.9,en;q=0.8"
          }

          for file in ttml_files:
              track_id = file.replace(".ttml", "").strip()
              spotify_url = f"https://open.spotify.com/track/{track_id}"
              title = "Desconocido"
              artist = "Desconocido"

              try:
                  res = requests.get(spotify_url, headers=headers, timeout=10)
                  if res.status_code == 200:
                      soup = BeautifulSoup(res.text, 'html.parser')
                      
                      og_title = soup.find("meta", property="og:title")
                      if og_title and og_title.get("content"):
                          title = og_title["content"].strip()

                      og_desc = soup.find("meta", property="og:description")
                      if og_desc and og_desc.get("content"):
                          desc = og_desc["content"]
                          if "·" in desc:
                              parts = [p.strip() for p in desc.split("·")]
                              if len(parts) >= 2:
                                  if parts[0].lower() not in ["song", "canción", "single"]:
                                      artist = parts[0]
                                  else:
                                      artist = parts[1]
                          elif "by" in desc.lower():
                              m = re.search(r'by\s+(.*?)\s+on\s+Spotify', desc, re.IGNORECASE)
                              if m:
                                  artist = m.group(1).strip()
              except Exception as e:
                  print(f"Error parseando OG para {track_id}: {e}")

              if artist == "Desconocido" or title == "Desconocido":
                  try:
                      oembed_url = f"https://open.spotify.com/oembed?url={spotify_url}"
                      res_oe = requests.get(oembed_url, timeout=5)
                      if res_oe.status_code == 200:
                          data = res_oe.json()
                          if title == "Desconocido":
                              title = data.get("title", title)
                          if artist == "Desconocido" and "author_name" in data and data["author_name"]:
                              artist = data["author_name"]
                  except Exception:
                      pass

              readme_content += f"| **{title}** | {artist} | [Spotify link]({spotify_url}) | [`{file}`](./{file}) | `{track_id}` |\n"

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme_content)
          EOF

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update README with track info" && git push)
