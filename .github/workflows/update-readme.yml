name: Update README with Track Info

on:
  workflow_dispatch:
  push:
    paths:
      - '*.ttml'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch Song Metadata & Update README
        run: |
          python - << 'EOF'
          import glob, re, requests
          from bs4 import BeautifulSoup

          ttml_files = sorted(glob.glob("*.ttml"))

          readme_content = "# 🎵 Mis Letras Sincronizadas\n\n"
          readme_content += "Lista e índice de las letras sincronizadas actualizadas automáticamente.\n\n"
          readme_content += "| Canción | Artista | Enlace al Archivo (.ttml) | ID de Spotify |\n"
          readme_content += "| :--- | :--- | :--- | :--- |\n"

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept-Language": "es-ES,es;q=0.9,en;q=0.8"
          }

          for file in ttml_files:
              track_id = file.replace(".ttml", "").strip()
              title = "Desconocido"
              artist = "Desconocido"

              # 1. Intentar por scraping directo de la página web pública de Spotify (extrae meta og:title y og:description)
              try:
                  url = f"https://open.spotify.com/track/{track_id}"
                  res = requests.get(url, headers=headers, timeout=10)
                  if res.status_code == 200:
                      soup = BeautifulSoup(res.text, 'html.parser')
                      
                      # Meta título
                      og_title = soup.find("meta", property="og:title")
                      if og_title and og_title.get("content"):
                          title = og_title["content"].strip()

                      # Meta descripción (Suele tener el formato "Canción · Artista · Año" o "Escucha Canción en Spotify. Artista · Canción · año")
                      og_desc = soup.find("meta", property="og:description") or soup.find("meta", name="description")
                      if og_desc and og_desc.get("content"):
                          desc = og_desc["content"]
                          # Buscar patrones típicos de Spotify en la meta descripción
                          if "·" in desc:
                              parts = [p.strip() for p in desc.split("·")]
                              # Si el primer elemento es "Song" o "Canción", el segundo es el artista
                              if len(parts) >= 2:
                                  if parts[0].lower() in ["song", "canción", "single"]:
                                      artist = parts[1]
                                  else:
                                      artist = parts[0]
                          elif "by" in desc.lower():
                              match = re.search(r'by\s+(.*?)\s+on\s+Spotify', desc, re.IGNORECASE)
                              if match:
                                  artist = match.group(1).strip()
              except Exception as e:
                  print(f"Error accediendo a Spotify Web para {track_id}: {e}")

              # 2. Si el artista sigue siendo Desconocido, intentar oEmbed como respaldo secundario
              if artist == "Desconocido":
                  try:
                      oembed_url = f"https://open.spotify.com/oembed?url=https://open.spotify.com/track/{track_id}"
                      res_oe = requests.get(oembed_url, timeout=5)
                      if res_oe.status_code == 200:
                          data = res_oe.json()
                          if "author_name" in data and data["author_name"]:
                              artist = data["author_name"]
                  except Exception:
                      pass

              print(f"Resultado final -> {title} | {artist}")
              readme_content += f"| **{title}** | {artist} | [`{file}`](./{file}) | `{track_id}` |\n"

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme_content)
          EOF

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update README with track info" && git push)
